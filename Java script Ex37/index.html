<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise-37</title>

    <script>
 if(localStorage.getItem("theme") === "dark") {
            document.documentElement.classList.add("dark-theme");
        }
    </script>

    <link rel="stylesheet" href="style.css">
</head>
<body>


    <div class="blog-container">
        <div class="header-top">
            <button  id="dark-mode-toggle"> 🌙 Dark Mode </button>
        </div>
        <h1>Simple Blog</h1>

        <div class="search-box">
            <input type="text"  id="search-input" placeholder="Raadi waxaad rabto Qalabka ama Tamarta aad u baahantahay...">
        </div>

        <div class="create-bost">
            <h2>Create a New Post</h2>
            <form id="blog-form">
                <input type="text" id="post-title" placeholder="post-title" required>
                <input type="text" id="post-image" placeholder="image URL (optional)">
                <textarea id="post-content" placeholder="write your post here.." required></textarea>
                <button type="submit" id="add-post-btn">add post</button>
            </form>
        </div>

        <hr>

        <h1>all post</h1>
        <div id="posts-list">

        </div>

    </div>




    

    <script src="main.js"></script>
</body>
</html>
